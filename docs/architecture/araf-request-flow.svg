<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
<rect width="100%" height="100%" fill="#f2f3f3"/>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#16191f}
.h1{font-size:34px;font-weight:700} .h2{font-size:22px;font-weight:700} .h3{font-size:17px;font-weight:700}
.body{font-size:15px} .small{font-size:12px;fill:#5f6b7a} .muted{fill:#5f6b7a}
.blue{fill:#0972d3} .blueText{fill:#033160} .green{fill:#18794e}
</style>
<text x="70" y="62" class="h1">Araf request and authority flow</text>
<text x="70" y="96" class="body muted">Browser → BFF → CloudBackend → authoritative cloud backend.</text>
<rect x="80" y="180" width="250" height="110" rx="14" fill="#eef6ff" stroke="#70a9df" stroke-width="2"/>
<text x="105" y="220" class="h2">Browser</text><text x="105" y="252" class="small">Tenant or Operator Console</text>
<line x1="330" y1="235" x2="450" y2="235" stroke="#0972d3" stroke-width="4"/><polygon points="460,235 445,227 445,243" fill="#0972d3"/>
<rect x="460" y="180" width="290" height="110" rx="14" fill="#fff" stroke="#aab7b8" stroke-width="2"/>
<text x="490" y="220" class="h2">Araf BFF</text><text x="490" y="252" class="small">Session · CSRF · OIDC · API aggregation</text>
<line x1="750" y1="235" x2="870" y2="235" stroke="#0972d3" stroke-width="4"/><polygon points="880,235 865,227 865,243" fill="#0972d3"/>
<rect x="880" y="180" width="320" height="110" rx="14" fill="#eaf3ff" stroke="#0972d3" stroke-width="2"/>
<text x="910" y="220" class="h2">CloudBackend</text><text x="910" y="252" class="small">Server-side provider boundary</text>
<line x1="1000" y1="290" x2="650" y2="420" stroke="#5e9c86" stroke-width="4"/><polygon points="640,424 654,411 659,427" fill="#5e9c86"/>
<line x1="1080" y1="290" x2="1260" y2="420" stroke="#d88368" stroke-width="4"/><polygon points="1270,427 1251,424 1260,411" fill="#d88368"/>
<rect x="380" y="430" width="500" height="190" rx="16" fill="#eefaf7" stroke="#5e9c86" stroke-width="2"/>
<text x="420" y="470" class="h2 green">O3kBackend</text>
<text x="420" y="505" class="body">Native /o3k/v1</text>
<text x="420" y="535" class="small">Canonical O3K Operations and Cloud Kernel remain authoritative.</text>
<rect x="450" y="555" width="360" height="42" rx="8" fill="#fff" stroke="#8fc7b4"/><text x="630" y="582" text-anchor="middle" class="h3">O3K Cloud Kernel</text>
<rect x="980" y="430" width="500" height="190" rx="16" fill="#fff5f0" stroke="#d88368" stroke-width="2"/>
<text x="1020" y="470" class="h2" fill="#a6442a">OpenStackBackend</text>
<text x="1020" y="505" class="body">Keystone · Nova · Glance · Neutron · Cinder</text>
<text x="1020" y="535" class="small">CompatibilityOperation is correlation state only; provider truth wins.</text>
<rect x="1050" y="555" width="360" height="42" rx="8" fill="#fff" stroke="#e0a08d"/><text x="1230" y="582" text-anchor="middle" class="h3">OpenStack control plane</text>
<rect x="280" y="690" width="1040" height="90" rx="14" fill="#fff" stroke="#cbd5e1"/>
<text x="800" y="725" text-anchor="middle" class="h3">Security invariant</text>
<text x="800" y="754" text-anchor="middle" class="body muted">Raw cloud backend credentials/tokens never belong to browser JavaScript.</text>
</svg>