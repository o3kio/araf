# Reference deployment using pre-built, digest-pinned release artifacts.
# Set ARAF_VERSION and image digests in an external .env file; this file never
# contains OIDC or provider credentials.
services:
  tenant-bff:
    image: ${ARAF_BFF_IMAGE:?set ARAF_BFF_IMAGE}@${ARAF_BFF_DIGEST:?set ARAF_BFF_DIGEST}
    command: ["tenant-bff"]
    environment:
      ARAF_RUNTIME_PROFILE: production
      ARAF_UPSTREAM_ADAPTER: ${ARAF_UPSTREAM_ADAPTER:?set adapter}
      ARAF_PUBLIC_URL: ${ARAF_TENANT_PUBLIC_URL:?set tenant URL}
      ARAF_TRUSTED_ORIGINS: ${ARAF_TENANT_PUBLIC_URL:?set tenant URL}
      ARAF_SESSION_STORE_PATH: /var/lib/araf/sessions.json
      ARAF_SESSION_STORE_KEY: ${ARAF_SESSION_STORE_KEY:?set base64 session store key}
      O3K_URL: ${O3K_URL:-}
      O3K_TOKEN: ${O3K_TOKEN:-}
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
      OPENSTACK_TOKEN: ${OPENSTACK_TOKEN:-}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
      ARAF_OPENSTACK_COMPATIBILITY_JOURNAL: /var/lib/araf/compatibility-operations.json
      ARAF_TENANT_OIDC_CLIENT_ID: ${ARAF_TENANT_OIDC_CLIENT_ID:?set tenant OIDC client id}
      ARAF_TENANT_OIDC_CLIENT_SECRET: ${ARAF_TENANT_OIDC_CLIENT_SECRET:?set tenant OIDC client secret}
      ARAF_TENANT_OIDC_ISSUER_URL: ${ARAF_TENANT_OIDC_ISSUER_URL:?set tenant OIDC issuer}
      ARAF_TENANT_OIDC_REDIRECT_URI: ${ARAF_TENANT_OIDC_REDIRECT_URI:?set tenant OIDC redirect}
    volumes:
      - tenant-session:/var/lib/araf
    read_only: true
    stop_grace_period: 30s
    tmpfs: [/tmp]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/readyz"]
  operator-bff:
    image: ${ARAF_BFF_IMAGE:?set ARAF_BFF_IMAGE}@${ARAF_BFF_DIGEST:?set ARAF_BFF_DIGEST}
    command: ["operator-bff"]
    environment:
      ARAF_RUNTIME_PROFILE: production
      ARAF_UPSTREAM_ADAPTER: ${ARAF_UPSTREAM_ADAPTER:?set adapter}
      ARAF_PUBLIC_URL: ${ARAF_OPERATOR_PUBLIC_URL:?set operator URL}
      ARAF_TRUSTED_ORIGINS: ${ARAF_OPERATOR_PUBLIC_URL:?set operator URL}
      ARAF_SESSION_STORE_PATH: /var/lib/araf/sessions.json
      ARAF_SESSION_STORE_KEY: ${ARAF_SESSION_STORE_KEY:?set base64 session store key}
      O3K_URL: ${O3K_URL:-}
      O3K_TOKEN: ${O3K_TOKEN:-}
      OPENSTACK_AUTH_URL: ${OPENSTACK_AUTH_URL:-}
      OPENSTACK_TOKEN: ${OPENSTACK_TOKEN:-}
      OPENSTACK_USERNAME: ${OPENSTACK_USERNAME:-}
      OPENSTACK_PASSWORD: ${OPENSTACK_PASSWORD:-}
      ARAF_OPENSTACK_COMPATIBILITY_JOURNAL: /var/lib/araf/compatibility-operations.json
      ARAF_OPERATOR_OIDC_CLIENT_ID: ${ARAF_OPERATOR_OIDC_CLIENT_ID:?set operator OIDC client id}
      ARAF_OPERATOR_OIDC_CLIENT_SECRET: ${ARAF_OPERATOR_OIDC_CLIENT_SECRET:?set operator OIDC client secret}
      ARAF_OPERATOR_OIDC_ISSUER_URL: ${ARAF_OPERATOR_OIDC_ISSUER_URL:?set operator OIDC issuer}
      ARAF_OPERATOR_OIDC_REDIRECT_URI: ${ARAF_OPERATOR_OIDC_REDIRECT_URI:?set operator OIDC redirect}
    volumes:
      - operator-session:/var/lib/araf
    read_only: true
    stop_grace_period: 30s
    tmpfs: [/tmp]
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8081/readyz"]
  tenant-console:
    image: ${ARAF_TENANT_CONSOLE_IMAGE:?set ARAF_TENANT_CONSOLE_IMAGE}@${ARAF_TENANT_CONSOLE_DIGEST:?set ARAF_TENANT_CONSOLE_DIGEST}
    environment:
      BFF_UPSTREAM: http://tenant-bff:8080
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    ports: ["5173:8080"]
    depends_on:
      tenant-bff: { condition: service_healthy }
  operator-console:
    image: ${ARAF_OPERATOR_CONSOLE_IMAGE:?set ARAF_OPERATOR_CONSOLE_IMAGE}@${ARAF_OPERATOR_CONSOLE_DIGEST:?set ARAF_OPERATOR_CONSOLE_DIGEST}
    environment:
      BFF_UPSTREAM: http://operator-bff:8081
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    ports: ["5174:8080"]
    depends_on:
      operator-bff: { condition: service_healthy }
volumes:
  tenant-session:
  operator-session:
