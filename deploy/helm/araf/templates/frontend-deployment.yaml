{{- range $surface := list "tenant" "operator" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "araf.fullname" $ }}-{{ $surface }}-frontend
spec:
  replicas: {{ $.Values.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: araf, araf.o3k.io/component: frontend, araf.o3k.io/surface: {{ $surface }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: araf, araf.o3k.io/component: frontend, araf.o3k.io/surface: {{ $surface }} }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "araf.frontendImage" (dict "Values" $.Values "surface" $surface) }}
          imagePullPolicy: {{ (index $.Values.frontendImage $surface).pullPolicy }}
          env:
            - name: BFF_UPSTREAM
              value: http://{{ include "araf.fullname" $ }}-{{ $surface }}-bff
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /, port: http }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          resources:
{{ toYaml $.Values.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: nginx-tmp, mountPath: /tmp }
      volumes:
        - { name: nginx-conf, emptyDir: { medium: Memory } }
        - { name: nginx-cache, emptyDir: { medium: Memory } }
        - { name: nginx-run, emptyDir: { medium: Memory } }
        - { name: nginx-tmp, emptyDir: { medium: Memory } }
---
{{- end }}
