{{- range $surface := list "tenant" "operator" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "araf.fullname" $ }}-{{ $surface }}-bff
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: araf, araf.o3k.io/surface: {{ $surface }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: araf, araf.o3k.io/surface: {{ $surface }} }
    spec:
      containers:
        - name: bff
          image: {{ include "araf.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["{{ $surface }}-bff"]
          env:
            - name: ARAF_RUNTIME_PROFILE
              value: production
            - name: ARAF_UPSTREAM_ADAPTER
              value: {{ $.Values.upstreamAdapter | quote }}
            - name: ARAF_VERSION
              value: {{ $.Values.version | quote }}
            - name: ARAF_GIT_SHA
              value: {{ $.Values.gitSha | quote }}
            - name: ARAF_SESSION_STORE_PATH
              value: /var/lib/araf/sessions.json
            - name: O3K_URL
              value: {{ $.Values.backend.o3kUrl | quote }}
            - name: O3K_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ $.Values.secrets.o3kTokenKey }}
                  optional: true
            - name: OPENSTACK_AUTH_URL
              value: {{ $.Values.backend.openstackAuthUrl | quote }}
            - name: OPENSTACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ $.Values.secrets.openstackTokenKey }}
                  optional: true
            - name: OPENSTACK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ $.Values.secrets.openstackUsernameKey }}
                  optional: true
            - name: OPENSTACK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ $.Values.secrets.openstackPasswordKey }}
                  optional: true
            {{- if eq $surface "tenant" }}
            - name: ARAF_TENANT_OIDC_CLIENT_ID
              value: {{ $.Values.oidc.tenantClientId | quote }}
            - name: ARAF_TENANT_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ $.Values.secrets.tenantOidcClientSecretKey }}
            - name: ARAF_TENANT_OIDC_ISSUER_URL
              value: {{ $.Values.oidc.tenantIssuerUrl | quote }}
            - name: ARAF_TENANT_OIDC_REDIRECT_URI
              value: {{ $.Values.oidc.tenantRedirectUri | quote }}
            {{- else }}
            - name: ARAF_OPERATOR_OIDC_CLIENT_ID
              value: {{ $.Values.oidc.operatorClientId | quote }}
            - name: ARAF_OPERATOR_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ $.Values.secrets.operatorOidcClientSecretKey }}
            - name: ARAF_OPERATOR_OIDC_ISSUER_URL
              value: {{ $.Values.oidc.operatorIssuerUrl | quote }}
            - name: ARAF_OPERATOR_OIDC_REDIRECT_URI
              value: {{ $.Values.oidc.operatorRedirectUri | quote }}
            {{- end }}
          ports: [{ name: http, containerPort: {{ if eq $surface "tenant" }}8080{{ else }}8081{{ end }} }]
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: session-store, mountPath: /var/lib/araf }]
      volumes:
        - name: session-store
          persistentVolumeClaim: { claimName: {{ include "araf.fullname" $ }}-{{ $surface }}-sessions }
---
{{- end }}
