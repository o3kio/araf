{{- range $surface := list "tenant" "operator" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "araf.fullname" $ }}-{{ $surface }}-frontend
spec:
  type: {{ $.Values.service.type }}
  selector: { app.kubernetes.io/name: araf, araf.o3k.io/component: frontend, araf.o3k.io/surface: {{ $surface }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
{{- end }}
