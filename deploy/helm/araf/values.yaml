image:
  repository: ghcr.io/o3kio/araf-bff
  digest: ""
  pullPolicy: IfNotPresent
frontendImage:
  tenant:
    repository: ghcr.io/o3kio/araf-tenant-console
    digest: ""
    pullPolicy: IfNotPresent
  operator:
    repository: ghcr.io/o3kio/araf-operator-console
    digest: ""
    pullPolicy: IfNotPresent
replicas: 2
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
service:
  type: ClusterIP
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
version: "0.0.0"
gitSha: unknown
upstreamAdapter: o3k
tenant:
  publicUrl: https://tenant.example.invalid
  trustedOrigins: https://tenant.example.invalid
operator:
  publicUrl: https://operator.example.invalid
  trustedOrigins: https://operator.example.invalid
sessionStore:
  storageClass: ""
backend:
  o3kUrl: ""
  o3kApiContract: ""
  openstackAuthUrl: ""
oidc:
  tenantIssuerUrl: ""
  tenantClientId: ""
  tenantRedirectUri: ""
  operatorIssuerUrl: ""
  operatorClientId: ""
  operatorRedirectUri: ""
secrets:
  name: araf-runtime-secrets
  sessionStoreKey: session-store-key
  o3kTokenKey: o3k-token
  tenantOidcClientSecretKey: tenant-oidc-client-secret
  operatorOidcClientSecretKey: operator-oidc-client-secret
  openstackTokenKey: openstack-token
  openstackUsernameKey: openstack-username
  openstackPasswordKey: openstack-password
