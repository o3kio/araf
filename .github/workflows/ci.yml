name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.14.0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  frontend:
    name: frontend (format, lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    env:
      ARAF_RUNTIME_PROFILE: test
      ARAF_UPSTREAM_ADAPTER: fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain for BFF fixture binary
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} \
            --profile minimal --component rustfmt --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: backend

      - name: Build tenant BFF fixture binary
        working-directory: backend
        run: cargo build -p tenant-bff

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit/component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Rust supply-chain scanners
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.18.3

      - name: Security release gate and dependency inventory
        run: ./tests/security-release-gate.sh

  rust:
    name: rust (fmt, clippy, check, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} \
            --profile minimal --component rustfmt --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

  browser-e2e:
    name: browser E2E (Chromium)
    runs-on: ubuntu-24.04
    env:
      ARAF_RUNTIME_PROFILE: test
      ARAF_UPSTREAM_ADAPTER: fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - name: Build fixture BFFs
        working-directory: backend
        run: cargo build -p tenant-bff -p operator-bff

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E suite
        run: pnpm e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
