name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.14.0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  frontend:
    name: frontend (format, lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    env:
      ARAF_RUNTIME_PROFILE: test
      ARAF_UPSTREAM_ADAPTER: fixture
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain for BFF fixture binary
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} \
            --profile minimal --component rustfmt --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: backend

      - name: Build tenant BFF fixture binary
        working-directory: backend
        run: cargo build -p tenant-bff

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit/component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Rust supply-chain scanners
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.18.3

      - name: Security release gate and dependency inventory
        run: ./tests/security-release-gate.sh

  rust:
    name: rust (fmt, clippy, check, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} \
            --profile minimal --component rustfmt --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features

  browser-e2e:
    name: browser E2E (Chromium)
    runs-on: ubuntu-24.04
    env:
      ARAF_RUNTIME_PROFILE: test
      ARAF_UPSTREAM_ADAPTER: fixture
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - name: Build fixture BFFs
        working-directory: backend
        run: cargo build -p tenant-bff -p operator-bff

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E suite
        run: pnpm e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: browser-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
