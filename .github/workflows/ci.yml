name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.14.0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  frontend:
    name: frontend (format, lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain for BFF fixture binary
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} \
            --profile minimal --component rustfmt --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build tenant BFF fixture binary
        working-directory: backend
        run: cargo build -p tenant-bff

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit/component tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  rust:
    name: rust (fmt, clippy, check, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} \
            --profile minimal --component rustfmt --component clippy
          rustup override set ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Tests
        run: cargo test --workspace --all-features
