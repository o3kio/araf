name: release-images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.14.0"
  RUST_TOOLCHAIN: "1.95.0"
  RELEASE_VERSION: ${{ github.ref_name }}

  # A release tag is the only version authority. Failed candidates consume a
  # version; reruns must use a successor tag.

jobs:
  release-preflight:
    name: Release identity and immutability preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reject mutable or non-prerelease identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ github.ref_type }}" = tag
          test "$RELEASE_VERSION" = "${{ github.ref_name }}"
          # RC-only identity gate: only vX.Y.Z-rc.N tags may publish. When a
          # stable v1.0.0 tag is eventually allowed past this regex, the
          # hard-coded --prerelease in the release-assets job below must
          # become version-derived (policy: ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|
          # alpha|beta)\.[0-9]+$, case-insensitive) like
          # .github/workflows/release-publish.yml, so stable releases are not
          # marked as prereleases. Do not weaken this gate in the meantime.
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          test "$(tr -d '\\n' < backend/RELEASE_VERSION)" = "$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 "$RELEASE_VERSION")"
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists" >&2
            exit 1
          fi
          for image in araf-bff araf-tenant-console araf-operator-console; do
            if docker buildx imagetools inspect "ghcr.io/o3kio/$image:$RELEASE_VERSION" >/dev/null 2>&1; then
              echo "OCI image tag already exists: $image:$RELEASE_VERSION" >&2
              exit 1
            fi
          done
      - name: Validate release contracts
        run: ./tests/release-contract-gate.sh
  security-gate:
    name: Release security and supply-chain gate
    runs-on: ubuntu-24.04
    # The verification job must not receive publication or signing tokens.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain and supply-chain scanners
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_TOOLCHAIN }}
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.18.3

      - name: Run release security gate
        run: ./tests/security-release-gate.sh

      - name: Verify packaging and rollback contract
        run: ./tests/package-upgrade-rollback.sh

      - name: Retain security inventories
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-inventory-${{ github.sha }}
          path: target/security/
          if-no-files-found: error

  images:
    name: Build, scan and attest OCI images
    needs: [release-preflight, security-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: araf-bff
            context: backend
            file: backend/Dockerfile
          - name: araf-tenant-console
            context: .
            file: Dockerfile.frontend
            app: tenant-console
          - name: araf-operator-console
            context: .
            file: Dockerfile.frontend
            app: operator-console
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest-pinned image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          build-args: |
            ARAF_VERSION=${{ env.RELEASE_VERSION }}
            ARAF_GIT_SHA=${{ github.sha }}
            ARAF_RELEASE_BUILD=1
            APP=${{ matrix.app }}
          provenance: mode=max
          sbom: true

      - name: Scan published image for blocking vulnerabilities
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            aquasec/trivy@sha256:571a2e900934a47da06ed30a5cb101d7f2df441841c42929fe9a0546ef184668 image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 "$IMAGE_REF"

      - name: Attach GitHub OIDC build provenance
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-assets:
    name: Verify published artifacts and build release manifest
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve immutable indexes and verify labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in BFF:araf-bff TENANT_CONSOLE:araf-tenant-console OPERATOR_CONSOLE:araf-operator-console; do
            key=${pair%%:*}; image=${pair##*:}
            digest=$(docker buildx imagetools inspect "ghcr.io/o3kio/$image:$RELEASE_VERSION" | awk '/Digest:/ {print $2; exit}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "ARAF_${key}_DIGEST=$digest" >> "$GITHUB_ENV"
            docker pull "ghcr.io/o3kio/$image@$digest" >/dev/null
            docker buildx imagetools inspect "ghcr.io/o3kio/$image@$digest" | tee "/tmp/$image-attestations.txt"
            grep -q 'attestation-manifest' "/tmp/$image-attestations.txt"
            labels=$(docker image inspect "ghcr.io/o3kio/$image@$digest" --format '{{index .Config.Labels "org.opencontainers.image.version"}} {{index .Config.Labels "org.opencontainers.image.revision"}}')
            test "$labels" = "$RELEASE_VERSION $GITHUB_SHA"
          done
      - name: Generate and validate manifest
        run: |
          ARAF_MANIFEST_PATH=release/manifest.json ARAF_MANIFEST_SHA_PATH=release/manifest.sha256 \
            node scripts/generate-release-manifest.mjs
          node scripts/validate-release-manifest.mjs release/manifest.json
      - name: Publish immutable GitHub prerelease
        # --prerelease is hard-coded because the preflight regex admits
        # RC-only tags. When stable tags are eventually allowed, derive this
        # flag from the version policy exactly like
        # .github/workflows/release-publish.yml (see the note in the
        # release-preflight job).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
            --title "Araf $RELEASE_VERSION — Release Candidate" \
            --notes-file release/README.md \
            release/manifest.json release/manifest.sha256 \
            release/manifest.schema.json release/release-contract.schema.json \
            deploy/docker-compose.release.yml deploy/helm/araf/Chart.yaml
