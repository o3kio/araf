name: release-images

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "10.14.0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  security-gate:
    name: Release security and supply-chain gate
    runs-on: ubuntu-24.04
    # The verification job must not receive publication or signing tokens.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Rust toolchain and supply-chain scanners
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal
          rustup override set ${{ env.RUST_TOOLCHAIN }}
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.18.3

      - name: Run release security gate
        run: ./tests/security-release-gate.sh

      - name: Retain security inventories
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-inventory-${{ github.sha }}
          path: target/security/
          if-no-files-found: error

  images:
    name: Build, scan and attest OCI images
    needs: security-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: araf-bff
            context: backend
            file: backend/Dockerfile
          - name: araf-tenant-console
            context: .
            file: Dockerfile.frontend
            app: tenant-console
          - name: araf-operator-console
            context: .
            file: Dockerfile.frontend
            app: operator-console
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push digest-pinned image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            ARAF_VERSION=${{ github.ref_name }}
            ARAF_GIT_SHA=${{ github.sha }}
            APP=${{ matrix.app }}
          provenance: mode=max
          sbom: true

      - name: Scan published image for blocking vulnerabilities
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            aquasec/trivy@sha256:571a2e900934a47da06ed30a5cb101d7f2df441841c42929fe9a0546ef184668 image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 "$IMAGE_REF"

      - name: Attach GitHub OIDC build provenance
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
