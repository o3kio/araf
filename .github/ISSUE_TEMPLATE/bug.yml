name: Bug report
description: Report reproducible incorrect Araf behavior.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow `SECURITY.md` instead.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal deterministic steps and relevant project/region context without secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: commit SHA or release
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, correlation/operation IDs, screenshots, or test failures with secrets removed.
